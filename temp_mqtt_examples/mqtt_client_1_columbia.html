<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQTT Client</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.js" type="text/javascript"></script>
</head>
<body>
    <h1>MQTT Client</h1>
    <div>
        <label for="message">Message:</label>
        <input type="text" id="message" placeholder="Enter message">
        <button onclick="sendMessage()">Send</button>
    </div>

    <div><button id="message2" value="{45}" onclick="sendMessage2()">45&deg;</button></div>

    <div><button id="message3" value="{90}" onclick="sendMessage3()">90&deg;</button></div>

    <div>
        <h2>Received Messages:</h2>
        <ul id="messages"></ul>
    </div>

    <script type="text/javascript">
        const broker = "test.mosquitto.org";
        const port = 8080; 
        const topic = "rafael";

        const client = new Paho.MQTT.Client(broker, port, "clientId" + new Date().getTime());

        client.onConnectionLost = onConnectionLost;
        client.onMessageArrived = onMessageArrived;

        client.connect({onSuccess: onConnect});

        function onConnect() {
            console.log("Connected to MQTT broker");
            client.subscribe(topic, {qos: 0});
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                console.log("Connection lost: " + responseObject.errorMessage);
            }
        }

        function onMessageArrived(message) {
            console.log("Message arrived: " + message.payloadString);
            const messagesList = document.getElementById("messages");
            const li = document.createElement("li");
            li.textContent = message.payloadString;
            messagesList.appendChild(li);
        }

        function sendMessage() {
            const messageInput = document.getElementById("message");
            const message = new Paho.MQTT.Message(messageInput.value);
            message.destinationName = topic;
            client.send(message);
            messageInput.value = ""; 
        }

        function sendMessage2() {
            const messageInput = document.getElementById("message2");
            const message = new Paho.MQTT.Message(messageInput.value);
            message.destinationName = topic;
            client.send(message);
        }

        function sendMessage3() {
            const messageInput = document.getElementById("message3");
            const message = new Paho.MQTT.Message(messageInput.value);
            message.destinationName = topic;
            client.send(message); 
        }
    </script>
</body>
</html>
