
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MQTT Клиент (WebSocket)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
    }
    .status {
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 20px;
    }
    .connected {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .disconnected {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    button {
      margin: 5px;
      padding: 8px 15px;
    }
    #messages {
      list-style-type: none;
      padding: 0;
    }
    #messages li {
      padding: 8px;
      margin: 5px 0;
      background: #f5f5f5;
      border-left: 4px solid #007bff;
    }
  </style>
  <!-- Подключаем библиотеку MQTT.js -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
  <h1>MQTT WebSocket Клиент</h1>

  <div id="status" class="status disconnected">Отключено</div>

  <div>
    <label for="message">Сообщение:</label>
    <input type="text" id="message" placeholder="Введите сообщение">
    <button onclick="sendMessage()">Отправить</button>
  </div>

  <div>
    <button onclick="sendAngle('{go}')">go</button>
    <button onclick="sendAngle('{stop}')">stop</button>
    <button onclick="sendAngle('{gori}')">gori</button>
    <button onclick="sendAngle('{potuhni}')">potuhni</button>
    <button onclick="sendAngle('{on}')">on</button>
    <button onclick="sendAngle('{off}')">off</button>
  </div>

  <div>
    <h2>Полученные сообщения:</h2>
    <ul id="messages"></ul>
  </div>

  <script>
    // Конфигурация подключения
    const broker = "Айпишка сервера ";
    const port = 8083;
    const topic = "test";
    const username = "admin";
    const password = "Пароль";

    // URL WebSocket для MQTT (EMQX стандартно использует /mqtt)
    const wsUrl = `ws://${broker}:${port}/mqtt`;

    let client = null;

    function updateStatus(text, isConnected = false) {
      const statusDiv = document.getElementById("status");
      statusDiv.textContent = text;
      statusDiv.className = "status " + (isConnected ? "connected" : "disconnected");
    }

    function addMessageToUI(message) {
      console.log("Получено сообщение:", message);
      const messagesList = document.getElementById("messages");
      const li = document.createElement("li");
      li.textContent = message;
      messagesList.appendChild(li);
    }

    function connect() {
      // Опции подключения
      const options = {
        username: username,
        password: password,
        clientId: "web_client_" + Math.random().toString(16).substr(2, 8), // уникальный ID
        clean: true,                // чистая сессия
        reconnectPeriod: 5000,      // авто-переподключение
        connectTimeout: 30 * 1000,  // таймаут подключения
        path: "/mqtt",              // путь WebSocket (уже указан в URL, но оставим для ясности)
      };

      client = mqtt.connect(wsUrl, options);

      client.on("connect", (connack) => {
        console.log("Подключено к MQTT брокеру", connack);
        updateStatus("✅ Подключено к MQTT брокеру", true);

        // Подписываемся на топик, чтобы получать сообщения
        client.subscribe(topic, (err) => {
          if (err) {
            console.error("Ошибка подписки:", err);
            updateStatus("❌ Ошибка подписки на топик", false);
          } else {
            console.log(`Подписаны на топик "${topic}"`);
            addMessageToUI(`[Система] Подписаны на топик "${topic}"`);
          }
        });
      });

      client.on("message", (receivedTopic, payload) => {
        const message = payload.toString();
        addMessageToUI(`[${receivedTopic}] ${message}`);
      });

      client.on("error", (error) => {
        console.error("Ошибка MQTT:", error);
        updateStatus(`❌ Ошибка: ${error.message}`, false);
      });

      client.on("close", () => {
        console.log("Соединение закрыто");
        updateStatus("❌ Отключено от брокера", false);
      });
    }

    function sendMessage() {
      if (!client || !client.connected) {
        alert("Нет подключения к MQTT брокеру!");
        return;
      }
      const input = document.getElementById("message");
      const payload = input.value;
      if (payload.trim() === "") return;

      client.publish(topic, payload, (err) => {
        if (err) {
          console.error("Ошибка отправки:", err);
          alert("Ошибка отправки: " + err.message);
        } else {
          console.log(`Сообщение "${payload}" отправлено в топик "${topic}"`);
          input.value = "";
        }
      });
    }

    function sendAngle(value) {
      if (!client || !client.connected) {
        alert("Нет подключения к MQTT брокеру!");
        return;
      }
      client.publish(topic, value, (err) => {
        if (err) {
          console.error("Ошибка отправки угла:", err);
        } else {
          console.log(`Угол ${value} отправлен`);
        }
      });
    }
    window.onload = () => {
      connect();
    };
  </script>
</body>
</html>
